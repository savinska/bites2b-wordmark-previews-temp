<script>
(() => {
 const svg=document.querySelector('#mark'),letters=[...svg.querySelectorAll('.letter')],blue=svg.querySelector('.blue'),bite=svg.querySelector('.bite-piece'),label=document.querySelector('#stage');
 const bounds=[{x:13,y:53,w:233,h:267},{x:238,y:28,w:76,h:262},{x:313,y:71,w:148,h:222},{x:461,y:106,w:177,h:196},{x:636,y:119,w:171,h:186}];
 const angle=[-28,56,-42,38,-58],ground=345,viewRight=1350,blueContact=352.5;
 const rotated=(b,a)=>{const r=Math.abs(a*Math.PI/180);return{w:b.w*Math.cos(r)+b.h*Math.sin(r),h:b.h*Math.cos(r)+b.w*Math.sin(r)}};
 const extent=(b,x,a)=>{const r=rotated(b,a),extra=(r.w-b.w)/2;return{left:b.x+x-extra,right:b.x+x+b.w+extra}};
 const scatter=[{dx:0,dy:-14.07},{dx:67.04,dy:81.24},{dx:189.89,dy:31.00},{dx:255.16,dy:9.29},{dx:308.73,dy:11.21}].map((p,i)=>({...p,a:angle[i],box:bounds[i]}));
 const state=bounds.map(()=>({x:0,y:-560,a:0,vx:0,vy:0,va:0,active:false,done:false,chain:false}));
 let raf=0,mode='';
 const paint=i=>letters[i].setAttribute('transform',`translate(${state[i].x.toFixed(2)} ${state[i].y.toFixed(2)}) rotate(${state[i].a.toFixed(2)} ${bounds[i].x+bounds[i].w/2} ${bounds[i].y+bounds[i].h/2})`);
 const floorY=(i,a)=>ground-(bounds[i].y+bounds[i].h/2+rotated(bounds[i],a).h/2);
 const showBite=(progress)=>{bite.style.opacity=String(1-progress)};
 function reset(){cancelAnimationFrame(raf);mode='';state.forEach((s,i)=>{Object.assign(s,{x:0,y:-560,a:0,vx:0,vy:0,va:0,active:false,done:false,chain:false});letters[i].style.opacity='0';paint(i)});blue.style.opacity='0';blue.setAttribute('transform','translate(0 0)');showBite(0)}
 function pose(which){reset();if(which==='scatter'||which==='contact'||which==='airborne'){state.forEach((s,i)=>{s.x=scatter[i].dx;s.y=scatter[i].dy-(which==='airborne'?[66,104,82,124,148][i]:0);s.a=scatter[i].a+(which==='airborne'?[9,-10,12,-8,7][i]:0);letters[i].style.opacity='1';paint(i)});if(which==='contact'||which==='airborne'){blue.style.opacity='1';blue.setAttribute('transform',`translate(${which==='contact'?blueContact:blueContact+60} 0)`)}label.textContent=which==='scatter'?'2 · Crooked, disorganized pause':which==='contact'?'3 · Blue 2B makes contact':'4 · Right-to-left airborne reaction'}else{state.forEach((s,i)=>{Object.assign(s,{x:0,y:0,a:0});letters[i].style.opacity='1';paint(i)});blue.style.opacity='1';blue.setAttribute('transform','translate(0 0)');showBite(which==='bitten'?1:0);label.textContent=which==='bitten'?'6 · Orange B bite complete':'5 · Aligned wordmark · B still whole'}}
 function run(slow=false){reset();mode='run';label.textContent='1 · Complete orange B and letters fall';const rate=slow ? .42 : 1,begin=performance.now();let last=begin,nextFall=0,blueX=viewRight+360-blueContact,blueActive=false,contact=false,chain=[false,false,false,false,false],landedAt=null,settleStart=null,settleFrom=null,blueFrom=0,biteStart=null;
  const startBite=now=>{mode='biting';biteStart=now;label.textContent='6 · Bite reveals in place on orange B'};
  function frame(now){const realDt=Math.min((now-last)/1000,.03);last=now;const dt=realDt*rate,t=(now-begin)*rate;
   if(mode==='run'){
    for(let i=0;i<5;i++){const s=state[i];if(!s.active&&t>=nextFall){s.active=true;s.x=scatter[i].dx;s.y=scatter[i].dy-520;s.a=scatter[i].a*.58;s.va=(i%2?1:-1)*(4+i*1.4);letters[i].style.opacity='1';nextFall+=850}
