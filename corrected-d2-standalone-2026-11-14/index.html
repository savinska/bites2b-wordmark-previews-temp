<title>Bites2B wordmark intro, variant D2 corrected</title>
<style>
:root {
    --stage: #ffffff;
    --ink: #0b1f52;
    --orange: #fc6155;
    --blue: #1742c8;

}
:root[data-theme="dark"] { --stage: #0b1f52; --ink: #f8faff; --blue: #ffffff; }
html, body { height: 100%; margin: 0; background: var(--stage); }
body { overflow: hidden; -webkit-font-smoothing: antialiased; }
.stage { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; align-items: center; padding: max(20px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); box-sizing: border-box; }
.stage-tools, .stage-actions { display: flex; align-items: center; justify-content: center; gap: 12px; z-index: 1; }
.stage-tools { justify-content: space-between; }
.stage-actions { min-height: 60px; }
.stage-button { min-height: 48px; padding: 12px 20px; border: 1px solid rgba(11,31,82,.22); border-radius: 999px; background: #fff; color: var(--ink); font: 650 1rem var(--font-sans); cursor: pointer; }
.stage-button:focus-visible { outline: 3px solid var(--orange); outline-offset: 3px; }
.stage-button-primary { min-width: min(280px, 80vw); border-color: var(--orange); background: var(--orange); color: #fff; box-shadow: 0 10px 24px rgba(11,31,82,.12); }
.stage-button[hidden] { display: none; }
.stage-tools .stage-button { min-height: 42px; padding: 9px 14px; font-size: .9rem; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.lockup { justify-self: center; align-self: center; }
.lockup { display: flex; flex-direction: column; align-items: center; width: min(88vw, 880px); }
@media (max-width: 899px) { .lockup { width: 84vw; } }
.mark { display: block; width: 100%; height: auto; aspect-ratio: 1194 / 326; overflow: visible; }
.mark .o { fill: var(--orange); }
.mark .b { fill: var(--blue); }
.slogan { width: max-content; max-width: calc(100vw - 32px); margin: clamp(20px, 3.8vw, 42px) 0 0; color: var(--ink); font: 700 clamp(1.5rem, 3.9vw, 2.85rem) / 1.2 var(--font-sans); letter-spacing: -.02em; text-align: center; text-wrap: balance; opacity: 0; transform: translateY(10px); }
@media (max-width: 359px) { .slogan { font-size: 1.375rem; } }
[data-capture] .stage-tools, [data-capture] .stage-actions { display: none; }
[data-reduced-motion="true"] .stage-tools, [data-reduced-motion="true"] #play-intro { display: none; }
[data-reduced-motion="true"] .slogan { opacity: 1; transform: none; }
[data-solo] .stage { place-items: start; padding: 0; }
[data-solo] .lockup { width: 1194px; }
[data-solo] .slogan, [data-solo] .replay { display: none; }
[data-solo], [data-solo] body { background: transparent; }
</style>

</main>
<script>
(() => {
    "use strict";
    const params = new URLSearchParams(location.search);
    const root = document.documentElement;
    const capture = params.has("capture");
    if (capture) root.setAttribute("data-capture", "");
    if (params.has("solo")) root.setAttribute("data-solo", "");
    root.dataset.theme = params.get("theme") === "dark" ? "dark" : "light";
    const lang = params.get("lang") === "en" ? "en" : "bg";
    root.lang = lang;
    const slogan = document.getElementById("slogan");
    slogan.textContent = lang === "en" ? "Bring order to your business." : "Сложи ред в бизнеса си.";
    const reduced = !capture && matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduced) root.dataset.reducedMotion = "true";
    const playButton = document.getElementById("play-intro");
    const continueButton = document.getElementById("continue-marketing");
    const soundButton = document.getElementById("sound-toggle");
    const skipButton = document.getElementById("skip-intro");
    const status = document.getElementById("intro-status");
    const copy = lang === "en"
        ? {play: "Play intro", skip: "Skip intro", soundOn: "Sound: On", soundOff: "Sound: Off", soundLabel: "Toggle sound", go: "See how →", finished: "The intro is complete."}
        : {play: "Пусни интрото", skip: "Пропусни", soundOn: "Звук: включен", soundOff: "Звук: изключен", soundLabel: "Включи или изключи звука", go: "Виж как →", finished: "Интрото завърши."};
    playButton.textContent = copy.play;
    skipButton.textContent = copy.skip;
    soundButton.textContent = copy.soundOff;
    soundButton.setAttribute("aria-label", copy.soundLabel);
    continueButton.textContent = copy.go;

    const svg = document.querySelector(".mark");
    const patch = document.getElementById("bite-patch");
    const crumbLayer = document.getElementById("crumbs");
    const camera = document.getElementById("camera");
    const LETTERS = ["B", "i", "t", "e", "s"];
    const ALL = [...LETTERS, "2B"];

    // ---- Geometry: outline samples and pivots, from the real glyph paths -------------------
    const glyph = {};
    for (const name of ALL) {
        const g = document.getElementById("g-" + name);
        const box = g.getBBox();
        // The traced outlines are polylines, so their points come straight from the path data,
        // subdivided to at most 4 units (far cheaper on phones than getPointAtLength).
        const pts = [];
        for (const p of g.querySelectorAll("path:not(#bite-patch)")) {
            for (const loop of p.getAttribute("d").split("Z")) {
                const v = loop.match(/-?[\d.]+/g);
                if (!v || v.length < 4) continue;
                const n = v.length / 2;
                for (let k = 0; k < n; k += 1) {
                    const x0 = +v[2 * k], y0 = +v[2 * k + 1];
                    const x1 = +v[(2 * k + 2) % v.length], y1 = +v[(2 * k + 3) % v.length];
                    const steps = Math.max(1, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 4));
                    for (let j = 0; j < steps; j += 1) pts.push([x0 + (x1 - x0) * j / steps, y0 + (y1 - y0) * j / steps]);
                }
            }
        }
        glyph[name] = {g, pts, c: [box.x + box.width / 2, box.y + box.height / 2]};
    }
    // The 2B meets the s with the 2's upper body; the corner of the 2's base ends up under the s,
    // and the B trails behind the 2.
    glyph["2B"].contactPts = glyph["2B"].pts.filter(([x, y]) => x < 957.9 && y > 136.3 && y < 211.1);
    for (const name of LETTERS) glyph[name].contactPts = glyph[name].pts;

    const rad = Math.PI / 180;
    const place = (pt, pose, c) => {
        const r = pose.a * rad, cs = Math.cos(r), sn = Math.sin(r);
        const dx = pt[0] - c[0], dy = pt[1] - c[1];
        return [c[0] + dx * cs - dy * sn + pose.x, c[1] + dx * sn + dy * cs + pose.y];
    };
    const BIN = 5;
    const profile = (pts, pose, c, side) => {
        const m = new Map();
        for (const pt of pts) {
            const [x, y] = place(pt, pose, c);
            const b = Math.floor(y / BIN), v = m.get(b);
            if (v === undefined || (side < 0 ? x < v : x > v)) m.set(b, x);
        }
        return m;
    };
    // Horizontal clearance between the right glyph's leading edge and the left glyph's trailing edge.
    const gap = (rightName, rightPose, leftName, leftPose) => {
        const R = glyph[rightName], L = glyph[leftName];
        const lead = profile(R.contactPts, rightPose, R.c, -1);
        const trail = profile(L.contactPts, leftPose, L.c, 1);
        let g = Infinity;
        for (const [b, x] of lead) {
            const t = trail.get(b);
            if (t !== undefined) g = Math.min(g, x - t);
        }
        return g;
    };

    // ---- Easing and small physics helpers -----------------------------------------------
    const clamp01 = (v) => v < 0 ? 0 : v > 1 ? 1 : v;
    const outPow = (u, p) => 1 - Math.pow(1 - clamp01(u), p);
    const inPow = (u, p) => Math.pow(clamp01(u), p);
    // Damped rocking that starts at 1 and settles to exactly 0 at u = 1.
    const rock = (u, decay, cycles) => {
        u = clamp01(u);
        return Math.exp(-decay * u) * Math.cos(2 * Math.PI * cycles * u) * (1 - Math.pow(u, 6));
    };

    // ---- Choreography -------------------------------------------------------------------
    const FLOOR = 326;
    // Deliberately scattered landing: wider spacing, alternating tilts. dx/a are offsets from the logo.
    const SCATTER = {
        B: {dx: 10, a: -6, drift: 18, spin: -15, at: 0.12},
        i: {dx: 52, a: 10, drift: 22, spin: 17, at: 0.29},
        t: {dx: 104, a: -8, drift: -18, spin: -13, at: 0.44},
        e: {dx: 166, a: 12, drift: 24, spin: 18, at: 0.58},
        s: {dx: 236, a: -10, drift: -20, spin: -16, at: 0.71}
    };
    const FALL = 0.46, BOUNCE1 = 26, BOUNCE2 = 6;
    const HOP = {s: 46, e: 38, t: 31, i: 25, B: 18};
    const PUSH = 0.6;
    const T = {};

    const restPose = {};
    for (const name of LETTERS) {
        const s = SCATTER[name], G = glyph[name];
        let lowest = -Infinity;
        for (const pt of G.pts) lowest = Math.max(lowest, place(pt, {x: s.dx, y: 0, a: s.a}, G.c)[1]);
        restPose[name] = {x: s.dx, y: FLOOR - lowest, a: s.a};
    }

    let dropFrom = -900, entryX = 1300;
    const measure = () => {
        const rect = svg.getBoundingClientRect();
        const scale = rect.width / 1194 || 1;
        dropFrom = -(rect.top / scale) - 420;
        entryX = (innerWidth - rect.left) / scale - 768 + 60;
    };
    measure();

    const fallPose = (name, t) => {
        const s = SCATTER[name], rest = restPose[name];
        const tau = t - s.at;
        const startY = dropFrom - 200 * LETTERS.indexOf(name) / 5;
        const height = rest.y - startY;
        const g = 2 * height / (FALL * FALL);
        if (tau < FALL) {
            const w = tau / FALL;
            return {x: rest.x + s.drift * (1 - w) * (1 - w), y: startY + height * w * w, a: rest.a + s.spin * (1 - w) * (1 - w)};
        }
        const v1 = Math.sqrt(2 * g * BOUNCE1), d1 = 2 * v1 / g;
        const v2 = Math.sqrt(2 * g * BOUNCE2), d2 = 2 * v2 / g;
        let after = tau - FALL, lift = 0;
        if (after < d1) lift = v1 * after - g * after * after / 2;
        else if (after < d1 + d2) { const k = after - d1; lift = v2 * k - g * k * k / 2; }
        const tilt = Math.sign(s.spin) * 3.2 * Math.exp(-(tau - FALL) / 0.12) * Math.sin(2 * Math.PI * (tau - FALL) / 0.26);
        return {x: rest.x, y: rest.y - lift, a: rest.a + tilt};
    };

    const pushPose = (name, t) => {
        const rest = restPose[name], u = clamp01((t - T.hit[name]) / PUSH);
        const w = clamp01(u / 0.62);
        return {
            x: rest.x * (1 - outPow(u, 3.2)),
            y: rest.y * (1 - outPow(u, 2.4)) - HOP[name] * 4 * w * (1 - w),
            a: rest.a * rock(u, 4.2, 1.15)
        };
    };

    const blueEntry = 0.34, bluePush = 0.7;
    const bluePose = (t) => {
        const fromX = entryX + T.cam;
        if (t < T.blueIn) return {x: fromX, y: 0, a: 0};
        if (t < T.contact) {
            const u = (t - T.blueIn) / blueEntry;
            return {x: fromX + (T.contactX - fromX) * inPow(u, 1.7), y: 0, a: 0};
        }
        const u = clamp01((t - T.contact) / bluePush), w = clamp01(u / 0.4);
        return {
            x: T.contactX * (1 - outPow(u, 2.4)),
            y: -9 * 4 * w * (1 - w),
            a: -2.6 * Math.exp(-5 * u) * Math.sin(2 * Math.PI * 1.1 * u) * (1 - Math.pow(u, 6))
        };
    };

    const naturalPose = (name, t) => {
        if (name === "2B") return bluePose(t);
        if (t < SCATTER[name].at) return null;
        if (t < T.hit[name]) return fallPose(name, t);
        return pushPose(name, t);
    };
    // Left-to-right: once a glyph is pushing, it is blocked by the glyph in front of it, so it can
    // press against it but never pass through. Final gaps are never blocked, so the logo is exact.
    const ORDER = ["B", "i", "t", "e", "s", "2B"];
    const FINAL = {x: 0, y: 0, a: 0};
    const floorGap = {};
    const posesAt = (t) => {
        const poses = {};
        for (let k = 0; k < ORDER.length; k += 1) {
            const name = ORDER[k];
            let pose = naturalPose(name, t);
            const left = ORDER[k - 1];
            const pushing = name === "2B" ? t >= T.contact : pose && t >= T.hit[name];
            if (pose && left && pushing && poses[left]) {
                const g = gap(name, pose, left, poses[left]);
                if (g < floorGap[name]) pose = {...pose, x: pose.x + floorGap[name] - g};
            }
            poses[name] = pose;
        }
        return poses;
    };

    // Timeline: contact detection decides each hit, so the reaction travels at the speed of the push.
    const buildTimeline = () => {
        for (let k = 1; k < ORDER.length; k += 1) floorGap[ORDER[k]] = Math.min(0, gap(ORDER[k], FINAL, ORDER[k - 1], FINAL));
        T.landed = SCATTER.s.at + FALL + 0.3;
        T.blueIn = T.landed + 0.32;
        T.contact = T.blueIn + blueEntry;
        let lo = 0, hi = 2400;
        for (let k = 0; k < 24; k += 1) {
            const mid = (lo + hi) / 2;
            if (gap("2B", {x: mid, y: 0, a: 0}, "s", restPose.s) > 0) hi = mid; else lo = mid;
        }
        T.contactX = hi;
        // Camera: centre the widest moment (scattered word plus the incoming 2B), then return to the logo.
        T.cam = hi / 2;
        T.hit = {s: T.contact};
        const chain = ["s", "e", "t", "i", "B"];
        for (let k = 1; k < chain.length; k += 1) {
            const pusher = chain[k - 1], name = chain[k];
            T.hit[name] = Infinity;
            const touches = (t) => gap(pusher, pushPose(pusher, t), name, restPose[name]) <= 0.5;
            // Coarse 8 ms scan, then refine to 1 ms inside the step that first touches.
            for (let t = T.hit[pusher]; t < T.hit[pusher] + PUSH; t += 0.008) {
                if (!touches(t)) continue;
                let fine = Math.max(T.hit[pusher], t - 0.008);
                while (fine < t && !touches(fine)) fine += 0.001;
                T.hit[name] = fine;
                break;
            }
            if (!Number.isFinite(T.hit[name])) T.hit[name] = T.hit[pusher] + 0.08;
        }
        T.settled = Math.max(T.contact + bluePush, ...chain.map((n) => T.hit[n] + PUSH));
        T.bite = T.settled + 0.22;
        T.slogan = T.bite + 0.32;
        T.end = T.slogan + 0.62;
    };
    buildTimeline();

    // Crumbs: small pieces of the B, thrown from the bite notch.
    const CRUMBS = [
        {x: 196, y: 70, r: 6.5, vx: 230, vy: -330},
        {x: 214, y: 86, r: 4.8, vx: 300, vy: -220},
        {x: 181, y: 60, r: 4.2, vx: 150, vy: -400},
        {x: 222, y: 98, r: 3.6, vx: 340, vy: -140}
    ];
    const crumbEls = CRUMBS.map((c) => {
        const el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        el.setAttribute("r", c.r);
        el.setAttribute("opacity", "0");
        crumbLayer.appendChild(el);
        return el;
    });

    const fmt = (v) => Math.round(v * 100) / 100;
    const cameraX = (t) => t >= T.end ? 0 : -T.cam * (t < T.contact ? 1 : 1 - outPow((t - T.contact) / (bluePush + 0.25), 2.4));
    const render = (t) => {
        const cam = cameraX(t);
        if (cam === 0) camera.removeAttribute("transform"); else camera.setAttribute("transform", `translate(${fmt(cam)} 0)`);
        const poses = posesAt(t);
        for (const name of ALL) {
            const G = glyph[name];
            let pose = poses[name];
            if (!pose) { G.g.setAttribute("visibility", "hidden"); continue; }
            G.g.removeAttribute("visibility");
            if (name === "B" && t > T.bite) {
                const k = t - T.bite;
                pose = {...pose, a: pose.a + 2.4 * Math.exp(-k / 0.11) * Math.sin(2 * Math.PI * k / 0.24)};
            }
            if (t >= T.end || (pose.x === 0 && pose.y === 0 && pose.a === 0)) { G.g.removeAttribute("transform"); continue; }
            G.g.setAttribute("transform", `translate(${fmt(pose.x)} ${fmt(pose.y)}) rotate(${fmt(pose.a)} ${fmt(G.c[0])} ${fmt(G.c[1])})`);
        }
        const bitten = t >= T.bite;
        patch.setAttribute("visibility", bitten ? "hidden" : "visible");
        CRUMBS.forEach((c, k) => {
            const tau = t - T.bite;
            const el = crumbEls[k];
            if (tau < 0 || tau > 0.7) { el.setAttribute("opacity", "0"); return; }
            el.setAttribute("cx", fmt(c.x + c.vx * tau));
            el.setAttribute("cy", fmt(c.y + c.vy * tau + 0.5 * 1500 * tau * tau));
            el.setAttribute("opacity", fmt(tau < 0.38 ? 1 : 1 - (tau - 0.38) / 0.32));
        });
        const s = clamp01((t - T.slogan) / 0.55), e = outPow(s, 3);
        slogan.style.opacity = String(e);
        slogan.style.transform = `translateY(${fmt(10 * (1 - e))}px)`;
    };

    // ---- Sound: generated locally with Web Audio; no downloaded or third-party effects ----
    const SOUND_KEY = "bites2b.marketing.intro.sound";
    const getSoundPreference = () => {
        try { return sessionStorage.getItem(SOUND_KEY) === "on"; } catch (_) { return false; }
    };
    const setSoundPreference = (enabled) => {
        try { sessionStorage.setItem(SOUND_KEY, enabled ? "on" : "off"); } catch (_) { /* private mode */ }
    };
    let soundEnabled = getSoundPreference(), audio = null, master = null, noise = null;
    const syncSoundButton = () => {
        soundButton.textContent = soundEnabled ? copy.soundOn : copy.soundOff;
        soundButton.setAttribute("aria-pressed", String(soundEnabled));
    };
    const audioFailed = () => {
        soundEnabled = false;
        setSoundPreference(false);
        syncSoundButton();
    };
    const unlockAudio = () => {
        if (!soundEnabled) return;
        try {
            const Audio = window.AudioContext || window.webkitAudioContext;
            if (!Audio) throw new Error("Web Audio unavailable");
            if (!audio) {
                audio = new Audio();
                master = audio.createGain();
                master.gain.value = 0.42;
                master.connect(audio.destination);
                noise = audio.createBuffer(1, Math.ceil(audio.sampleRate * 0.24), audio.sampleRate);
                const samples = noise.getChannelData(0);
                for (let i = 0; i < samples.length; i += 1) samples[i] = (Math.random() * 2 - 1) * (1 - i / samples.length * 0.35);
            }
            const resumed = audio.resume();
            if (resumed && typeof resumed.catch === "function") resumed.catch(audioFailed);
        } catch (_) { audioFailed(); }
    };
    const tone = (frequency, endFrequency, at, duration, peak, type = "sine") => {
        if (!soundEnabled || !audio || audio.state !== "running") return;
        try {
            const osc = audio.createOscillator(), gain = audio.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(frequency, at);
            osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFrequency), at + duration);
            gain.gain.setValueAtTime(0.0001, at);
            gain.gain.linearRampToValueAtTime(peak, at + 0.006);
            gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
            osc.connect(gain); gain.connect(master);
            osc.start(at); osc.stop(at + duration + 0.01);
        } catch (_) { audioFailed(); }
    };
    const noiseBurst = (at, duration, peak, frequency, q, filterType) => {
        if (!soundEnabled || !audio || audio.state !== "running" || !noise) return;
        try {
            const source = audio.createBufferSource(), filter = audio.createBiquadFilter(), gain = audio.createGain();
            source.buffer = noise;
            filter.type = filterType; filter.frequency.value = frequency; filter.Q.value = q;
            gain.gain.setValueAtTime(Math.max(0.0001, peak), at);
            gain.gain.exponentialRampToValueAtTime(0.0001, at + duration);
            source.connect(filter); filter.connect(gain); gain.connect(master);
            source.start(at); source.stop(at + duration + 0.01);
        } catch (_) { audioFailed(); }
    };
    const clatter = () => {
        if (!soundEnabled || !audio || audio.state !== "running") return;
        const at = audio.currentTime, pitch = 0.88 + Math.random() * 0.24, level = 0.07 + Math.random() * 0.035;
        tone(820 * pitch, 510 * pitch, at, 0.12, level, "triangle");
        tone(1370 * pitch, 920 * pitch, at + 0.014, 0.085, level * 0.55, "sine");
        noiseBurst(at, 0.075, level * 0.45, 2100 * pitch, 1.4, "bandpass");
    };
    const impact = (secondary = false) => {
        if (!soundEnabled || !audio || audio.state !== "running") return;
        const at = audio.currentTime, scale = secondary ? 0.22 : 1;
        tone(104, 48, at, 0.19, 0.25 * scale, "sine");
        tone(64, 38, at + 0.008, 0.13, 0.13 * scale, "triangle");
        noiseBurst(at, 0.075, 0.16 * scale, 520, 0.65, "lowpass");
    };
    const crunch = () => {
        if (!soundEnabled || !audio || audio.state !== "running") return;
        const at = audio.currentTime;
        noiseBurst(at, 0.16, 0.19, 1850, 0.9, "bandpass");
        tone(2380, 1320, at + 0.004, 0.095, 0.095, "triangle");
        tone(1680, 940, at + 0.035, 0.12, 0.07, "sine");
    };
    syncSoundButton();
    soundButton.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        setSoundPreference(soundEnabled);
        syncSoundButton();
        if (soundEnabled) unlockAudio();
    });

    // ---- Playback: the approved timeline and choreography are unchanged --------------------
    let start = 0, frame = 0, lastSoundTime = -0.001, finished = false;
    const soundEvents = [
        ...LETTERS.map((name) => ({at: SCATTER[name].at + FALL, type: "land"})),
        {at: T.contact, type: "impact"},
        ...["e", "t", "i", "B"].map((name) => ({at: T.hit[name], type: "secondary"})),
        {at: T.bite, type: "bite"}
    ].sort((a, b) => a.at - b.at);
    const soundBetween = (from, to) => {
        for (const event of soundEvents) {
            if (event.at <= from || event.at > to) continue;
            if (event.type === "land") clatter();
            else if (event.type === "impact") impact(false);
            else if (event.type === "secondary") impact(true);
            else if (event.type === "bite") crunch();
        }
    };
    const finish = () => {
        if (finished) return;
        finished = true;
        continueButton.hidden = false;
        playButton.hidden = true;
        status.textContent = copy.finished;
    };
    const tellParent = (action) => {
        if (window.parent !== window) window.parent.postMessage({type: "bites2b:intro:" + action}, location.origin);
        else if (action === "continue" || action === "skip") location.href = "/marketing";
    };
    continueButton.addEventListener("click", () => tellParent("continue"));
    skipButton.addEventListener("click", () => tellParent("skip"));
    const tick = (now) => {
        const t = (now - start) / 1000;
        render(t);
        soundBetween(lastSoundTime, t);
        lastSoundTime = t;
        if (t < T.end) frame = requestAnimationFrame(tick);
        else finish();
    };
    const play = () => {
        if (reduced || capture) return;
        if (soundEnabled) unlockAudio();
        cancelAnimationFrame(frame);
        finished = false;
        continueButton.hidden = true;
        playButton.hidden = true;
        lastSoundTime = -0.001;
        measure();
        start = performance.now() + 120;
        render(0);
        frame = requestAnimationFrame(tick);
    };
    playButton.addEventListener("click", play);
    addEventListener("resize", measure);
    window.wordmark = {
        timeline: T, restPose, floorGap, cameraX,
        seek: (t) => render(t),
        // Smallest clearance between neighbours during the reaction, relative to the floor that
        // the final logo itself allows (0 or the logo's own overlap); negative means interpenetration.
        minGaps: () => {
            const out = {};
            for (let k = 1; k < ORDER.length; k += 1) {
                const r = ORDER[k], l = ORDER[k - 1];
                let m = Infinity, at = 0, maxStep = 0, prevX = null;
                for (let t = T.landed; t < T.settled + 0.05; t += 1 / 120) {
                    const poses = posesAt(t);
                    if (!poses[r] || !poses[l]) continue;
                    const g = gap(r, poses[r], l, poses[l]) - floorGap[r];
                    if (g < m) { m = g; at = t; }
                    if (prevX !== null) maxStep = Math.max(maxStep, Math.abs(poses[r].x - prevX));
                    prevX = poses[r].x;
                }
                out[r + ">" + l] = {minClearance: fmt(m), at: fmt(at), maxStepPer120Hz: fmt(maxStep)};
            }
            const rests = {};
            for (let k = 1; k < LETTERS.length; k += 1) rests[LETTERS[k] + ">" + LETTERS[k - 1]] = fmt(gap(LETTERS[k], restPose[LETTERS[k]], LETTERS[k - 1], restPose[LETTERS[k - 1]]));
            out.scatterGaps = rests;
            return out;
        }
    };
    if (reduced) {
        render(T.end + 1);
        finish();
        soundButton.disabled = true;
    } else if (capture) render(0);
    if (window.parent !== window) window.parent.postMessage({type: "bites2b:intro:ready"}, location.origin);
})();
</script>
</body>
</html>
